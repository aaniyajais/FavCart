{% extends 'base.html'%}
{% block content %}
<style>
    .txt{height:50px;margin-bottom:15px;}
    .txta{height:80px;margin-bottom:15px;}


</style>


<div class="fs-2 text-pcolor text-center"/>REGISTER <b class="">HERE..</b>
<i class="fa-solid fa-cart-shopping "></i></div>
<div class="row">
    <div class="col-sm-1"></div>
    <div class="col-sm-10">
        <div class="row">

            <div class="col-sm-7">
                <form method="POST" enctype="multipart/form-data">
                 {% csrf_token %}
                    <input type="text" class="txt form-control" name="name" required placeholder="Enter name">
                    <input type="email"class="txt form-control" name="email" required placeholder="Enter email">
                    <input type="password"class="txt form-control" name="passwd" required placeholder="Enter password">
                    <input type="number" class="txt form-control"name="mob" required placeholder="Enter number">
                    <input type="file"class="txt form-control" name="pic" required>
                    <textarea placeholder="enter address" name="address" class="form-control class txta" required></textarea>
                    <input type="submit" value="register now" class="btn text-light bg-pcolor">
                </form>
            </div>
            <div class="col-sm-5"></div>
        </div>
    </div>
     <div class="col-sm-1"></div>

</div>
{% endblock %}
